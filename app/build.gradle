plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xlzhen.simpleprotocolplayer'
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.xlzhen.simpleprotocolplayer"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 200
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-project.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'commons-validator:commons-validator:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
}

configurations {
    configureEach {
        exclude module: 'commons-logging'
    }
}
